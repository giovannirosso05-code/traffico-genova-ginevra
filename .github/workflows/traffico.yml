name: Aggiorna traffico
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: traffico, cancel-in-progress: false }
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leggi le fonti
        env:
          OTD_TOKEN: ${{ secrets.OTD_TOKEN }}
        run: |
          GEOCODE=1 python3 traffico/aggiorna.py > /tmp/dati.json && mv /tmp/dati.json traffico/sito/dati.json
          python3 traffico/storico.py
          python3 traffico/atmb.py || true
          python3 traffico/prova_siti.py || true
      - name: Salva dati
        run: |
          git config user.name "aggiornamento-traffico"
          git config user.email "actions@users.noreply.github.com"
          git add traffico/sito/*.json
          git diff --cached --quiet || (git commit -m "Dati traffico $(date -u +%FT%H:%M)" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: traffico/sito }
      - uses: actions/deploy-pages@v4
      - name: Notifica chiusure (ntfy)
        if: ${{ vars.NTFY_TOPIC != '' }}
        run: |
          MSG=$(python3 -c "import json;e=[x for x in json.load(open('traffico/sito/dati.json'))['eventi'] if x['tipo'] in('chiusura','incidente')];print('\n'.join(x['strada']+': '+x['testo'] for x in e))")
          [ -n "$MSG" ] && curl -s -H "Title: Genova-Ginevra: chiusure o incidenti" -d "$MSG" "https://ntfy.sh/${{ vars.NTFY_TOPIC }}" || true
