name: Aggiorna traffico
on:
  schedule:
    # ogni 15 minuti: GitHub spesso ritarda o salta i giri programmati, così ne arrivano comunque di più
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: traffico, cancel-in-progress: false }
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Leggi le fonti
        env:
          OTD_TOKEN: ${{ secrets.OTD_TOKEN }}
        run: |
          GEOCODE=1 python3 traffico/aggiorna.py > /tmp/dati.json && mv /tmp/dati.json traffico/sito/dati.json
          python3 traffico/storico.py || true
          python3 traffico/atmb.py || true
      - name: Salva dati
        run: |
          git config user.name "aggiornamento-traffico"
          git config user.email "actions@users.noreply.github.com"
          git add traffico/sito/*.json
          [ -f traffico/svincoli.json ] && git add traffico/svincoli.json
          git diff --cached --quiet && exit 0
          git commit -m "Dati traffico $(date -u +%FT%H:%M)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          echo "Salvataggio dei dati non riuscito: il sito viene pubblicato comunque con i dati nuovi"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: { path: traffico/sito }
  pubblica:
    # job separato: è lo schema ufficiale di GitHub ed evita l'errore "No artifacts named github-pages"
    needs: aggiorna
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
